[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nnlab"
version = "1.0.0"
description = "Readable NumPy implementations of classic neural-network algorithms, with lesson notebooks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anup Bagale" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]
keywords = ["neural networks", "perceptron", "backpropagation", "hebbian learning", "fuzzy logic", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "nbmake>=1.4", "jupyter"]

[project.urls]
Homepage = "https://github.com/anupbagale/Neural_Network_lab"
Issues = "https://github.com/anupbagale/Neural_Network_lab/issues"

[tool.setuptools]
packages = ["nnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
